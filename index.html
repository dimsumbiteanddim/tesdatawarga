<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendataan Kependudukan Kota Banjarmasin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f0f2f5; padding: 20px; }
    .container { max-width: 650px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #1b5e20; margin-bottom: 5px; text-transform: uppercase; }
    p.subtitle { text-align: center; color: #666; margin-bottom: 25px; font-size: 14px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .full-width { grid-column: span 2; }
    .form-group { display: flex; flex-direction: column; }
    label { font-size: 13px; font-weight: 600; color: #333; margin-bottom: 5px; }
    input, select, textarea { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; transition: 0.3s; }
    input:focus, select:focus, textarea:focus { border-color: #2e7d32; box-shadow: 0 0 5px rgba(46,125,50,0.3); }
    button { background-color: #2e7d32; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
    button:hover { background-color: #1b5e20; }
    button:disabled { background-color: #a5d6a7; cursor: not-allowed; }
    #alertBox { display: none; padding: 12px; border-radius: 6px; margin-bottom: 20px; text-align: center; font-weight: bold; font-size: 14px; }
    .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    @media (max-width: 500px) { .form-grid { grid-template-columns: 1fr; } .full-width { grid-column: span 1; } }
  </style>
</head>
<body>

<div class="container">
  <h2>Aplikasi Pendataan Warga</h2>
  <p class="subtitle">Kota Banjarmasin (Tingkat Kelurahan & RT)</p>

  <div id="alertBox"></div>

  <form id="kependudukanForm">
    <div class="form-grid">
      
      <div class="form-group">
        <label for="no_kk">No. Kartu Keluarga (KK)</label>
        <input type="text" id="no_kk" maxlength="16" pattern="\d{16}" placeholder="16 Digit No KK" required>
      </div>

      <div class="form-group">
        <label for="nik">NIK (Nomor KTP)</label>
        <input type="text" id="nik" maxlength="16" pattern="\d{16}" placeholder="16 Digit NIK" required>
      </div>

      <div class="form-group full-width">
        <label for="nama_lengkap">Nama Lengkap</label>
        <input type="text" id="nama_lengkap" placeholder="Sesuai KTP" required>
      </div>

      <div class="form-group">
        <label for="kelurahan">Kelurahan</label>
        <input type="text" id="kelurahan" placeholder="Contoh: Sungai Miai" required>
      </div>

      <div class="form-group">
        <label for="rt">RT (Nomor RT)</label>
        <input type="text" id="rt" placeholder="Contoh: 01" required>
      </div>

      <div class="form-group">
        <label for="gender">Jenis Kelamin</label>
        <select id="gender" required>
          <option value="">-- Pilih --</option>
          <option value="Laki-laki">Laki-laki</option>
          <option value="Perempuan">Perempuan</option>
        </select>
      </div>

      <div class="form-group">
        <label for="agama">Agama</label>
        <select id="agama" required>
          <option value="">-- Pilih --</option>
          <option value="Islam">Islam</option>
          <option value="Kristen">Kristen</option>
          <option value="Katolik">Katolik</option>
          <option value="Hindu">Hindu</option>
          <option value="Buddha">Buddha</option>
          <option value="Konghucu">Konghucu</option>
        </select>
      </div>

      <div class="form-group">
        <label for="status_keluarga">Status Hubungan Keluarga</label>
        <select id="status_keluarga" required>
          <option value="">-- Pilih --</option>
          <option value="Kepala Keluarga">Kepala Keluarga</option>
          <option value="Istri">Istri</option>
          <option value="Anak">Anak</option>
          <option value="Mertua">Mertua</option>
          <option value="Lainnya">Lainnya</option>
        </select>
      </div>

      <div class="form-group">
        <label for="tgl_lahir">Tanggal Lahir</label>
        <input type="date" id="tgl_lahir" required>
      </div>

      <div class="form-group full-width">
        <label for="pekerjaan">Pekerjaan</label>
        <input type="text" id="pekerjaan" placeholder="Contoh: Wiraswasta" required>
      </div>

      <div class="form-group full-width">
        <label for="alamat_warga">Alamat Lengkap</label>
        <textarea id="alamat_warga" rows="3" placeholder="Jl. Nama Jalan, No. Rumah" required></textarea>
      </div>

      <button type="submit" id="submitBtn" class="full-width">Simpan Data Warga</button>
    </div>
  </form>
</div>

<script>
  // MANDATORI: TEMPEL URL WEB APP GOOGLE APPS SCRIPT KAMU DI SINI
  const SCRIPT_URL = "https://script.google.com/macros/s/XXXXX/exec";

  const form = document.getElementById('kependudukanForm');
  const submitBtn = document.getElementById('submitBtn');
  const alertBox = document.getElementById('alertBox');

  form.addEventListener('submit', function(e) {
    e.preventDefault();

    if (SCRIPT_URL.includes("XXXXX")) {
      showAlert("Silakan ganti URL SCRIPT_URL pada kode HTML dengan URL Web App Apps Script kamu!", "error");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerText = "Mengirim Data...";
    alertBox.style.display = "none";

    const payload = {
      no_kk: document.getElementById('no_kk').value.trim(),
      nik: document.getElementById('nik').value.trim(),
      nama_lengkap: document.getElementById('nama_lengkap').value.trim(),
      kelurahan: document.getElementById('kelurahan').value.trim(),
      rt: document.getElementById('rt').value.trim(),
      gender: document.getElementById('gender').value,
      agama: document.getElementById('agama').value,
      status_keluarga: document.getElementById('status_keluarga').value,
      tgl_lahir: document.getElementById('tgl_lahir').value,
      pekerjaan: document.getElementById('pekerjaan').value.trim(),
      alamat_warga: document.getElementById('alamat_warga').value.trim()
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      if (data.status === "success") {
        showAlert(data.message, "success");
        form.reset();
      } else {
        showAlert("Gagal: " + data.message, "error");
      }
    })
    .catch(err => {
      showAlert("Terjadi kesalahan jaringan atau script URL tidak valid.", "error");
      console.error(err);
    })
    .finally(() => {
      submitBtn.disabled = false;
      submitBtn.innerText = "Simpan Data Warga";
    });
  });

  function showAlert(msg, type) {
    alertBox.className = type;
    alertBox.innerText = msg;
    alertBox.style.display = "block";
  }
</script>

</body>
</html>
